<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Vice Paws — 50 missões dos gatos</title>
<meta name="description" content="Vice Paws: Mimo, Mimosa e Mortícia numa fuga neon de 50 missões. Ninguém fica para trás! Jogo de fã por @mimo.mimosa.morticia.">
<meta property="og:title" content="Vice Paws 🐾 — 50 missões dos gatos">
<meta property="og:description" content="Mimo (o cansado), Mortícia (a comilona) e Mimosa (a brava) contra os bulldogs policiais. Ninguém fica para trás!">
<meta property="og:image" content="/img/mimo.jpg">
<meta name="theme-color" content="#1a0730">
<link rel="icon" href="/img/mimo.jpg">
<style>
:root{--pink:#ff4fb8;--teal:#2de2e6;--sun:#ffb347;--ink:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#12041f;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:14px;box-shadow:0 0 40px #ff4fb855}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;text-align:center;background:linear-gradient(180deg,#12041fd9,#2a0b4af2);overflow:auto}
.screen.on{display:flex}
.logo{font-weight:900;font-style:italic;font-size:clamp(48px,14vw,86px);line-height:.88;letter-spacing:-1px;color:var(--pink);text-shadow:0 0 18px #ff4fb8aa,4px 4px 0 #000;-webkit-text-stroke:2px #000;margin:0}
.sub{color:var(--teal);font-weight:800;letter-spacing:2px;font-size:13px;margin:8px 0 12px;text-shadow:0 0 10px #2de2e6aa}
.team{display:flex;gap:8px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap;max-width:440px}
.tc{width:min(30vw,132px);background:#ffffff12;border:3px solid #ffffff30;border-radius:16px;padding:8px 6px;font-size:12px;line-height:1.25}
.tc img{width:78%;aspect-ratio:1;border-radius:50%;object-fit:cover;border:3px solid #000;display:block;margin:0 auto 4px}
.tc b{display:block;font-size:15px}
.tc i{display:block;color:var(--sun);font-style:normal;font-weight:700;margin:2px 0}
.btn{appearance:none;border:3px solid #000;border-radius:14px;background:var(--pink);color:#fff;font-weight:900;font-size:19px;padding:11px 24px;margin:5px;cursor:pointer;box-shadow:4px 4px 0 #000;font-style:italic;text-decoration:none;display:inline-block}
.btn.alt{background:var(--teal);color:#12041f}
.btn.ghost{background:#ffffff18;color:#fff;font-size:14px;padding:8px 14px;box-shadow:none;border-color:#ffffff40}
.btn:disabled{opacity:.5}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.small{font-size:12.5px;opacity:.85;max-width:360px;line-height:1.4;margin:6px 0}
.foot{font-size:10.5px;opacity:.6;margin-top:10px}
.foot a{color:#fff}
#grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(94vw,400px);margin:8px 0}
.lv{aspect-ratio:1;border:3px solid #000;border-radius:12px;background:#ffffff1c;color:#fff;font-weight:900;font-size:17px;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.lv small{font-size:10px;color:var(--sun);margin-top:3px;letter-spacing:-1px}
.lv.boss{background:#ff4fb855}
.lv.lock{opacity:.35;cursor:default}
.lv.next{box-shadow:0 0 0 3px var(--teal),0 0 14px var(--teal)}
.dist{font-weight:900;font-style:italic;color:var(--teal);margin:6px 0 0;font-size:18px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.tabs button{font-size:12px;padding:6px 10px}
.tabs button.on{background:var(--pink)}
h2{font-size:clamp(30px,9vw,48px);margin:0 0 4px;color:var(--pink);font-style:italic;font-weight:900;-webkit-text-stroke:1.5px #000;text-shadow:3px 3px 0 #000}
.big{font-size:40px;font-weight:900;margin:2px 0;color:var(--sun);text-shadow:3px 3px 0 #000}
.stars{font-size:38px;letter-spacing:4px;margin:0;text-shadow:2px 2px 0 #000}
#board{width:min(92vw,330px);background:#0006;border-radius:12px;padding:8px 12px;margin:8px 0;font-size:14px;text-align:left;max-height:28vh;overflow:auto}
#board ol{margin:4px 0;padding-left:22px}#board .me{color:var(--sun);font-weight:800}
.row{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
input#nick{font:inherit;font-size:16px;padding:9px 12px;border-radius:10px;border:3px solid #000;width:160px}
#topBtns{position:fixed;top:8px;right:8px;display:none;gap:6px;z-index:5}
#topBtns button{background:#0007;border:2px solid #ffffff55;color:#fff;border-radius:10px;width:38px;height:38px;font-size:18px;cursor:pointer}
#lang{position:fixed;top:10px;left:10px;z-index:30}
.toast{position:fixed;top:14%;left:50%;transform:translateX(-50%);background:#000c;padding:9px 16px;border-radius:12px;font-weight:800;display:none;z-index:40;max-width:90vw;text-align:center}
.brief{max-width:380px;background:#0005;border-radius:14px;padding:10px 14px;margin:8px 0;font-size:14px;line-height:1.45;text-align:left}
.brief b{color:var(--sun)}
.keys{font-size:11.5px;opacity:.75;margin-top:6px}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="topBtns"><button id="bPause" aria-label="pause">⏸</button><button id="bMute" aria-label="som">🔊</button></div>
<button id="lang" class="btn ghost" style="font-size:13px;padding:6px 10px">EN</button>
<div class="toast" id="toast"></div>

<!-- TITLE -->
<div id="menu" class="screen on">
  <p class="sub" data-t="presents"></p>
  <h1 class="logo">VICE<br>PAWS</h1>
  <p class="sub" data-t="tag"></p>
  <div class="team" id="team"></div>
  <p class="small" data-t="rule"></p>
  <div class="row"><button class="btn" id="go" data-t="play"></button><button class="btn ghost" id="toRank" data-t="rank"></button></div>
  <p class="foot"><span data-t="fan"></span> · <a href="https://www.instagram.com/mimo.mimosa.morticia/" target="_blank" rel="noopener">@mimo.mimosa.morticia</a></p>
</div>

<!-- MAP -->
<div id="map" class="screen">
  <div class="row" style="justify-content:space-between;width:min(94vw,400px)"><button class="btn ghost" id="mapBack">◀</button><b id="totStars"></b><span id="livesTxt"></span></div>
  <div class="tabs" id="tabs"></div>
  <p class="dist" id="distName"></p>
  <div id="grid"></div>
  <p class="small" id="distDesc"></p>
</div>

<!-- BRIEFING -->
<div id="brief" class="screen">
  <p class="sub" id="bDist"></p>
  <h2 id="bTitle"></h2>
  <div class="brief" id="bText"></div>
  <div class="row"><button class="btn" id="bGo" data-t="start"></button><button class="btn ghost" id="bBack" data-t="map"></button></div>
  <p class="keys" data-t="keys"></p>
</div>

<!-- PAUSE -->
<div id="pause" class="screen"><h2>PAUSE</h2><button class="btn" id="resume" data-t="resume"></button><button class="btn ghost" id="retry1" data-t="retry"></button><button class="btn ghost" id="quit" data-t="map"></button></div>

<!-- RESULT -->
<div id="result" class="screen">
  <h2 id="rTitle"></h2>
  <p class="stars" id="rStars"></p>
  <div class="big" id="rScore"></div>
  <p class="small" id="rInfo"></p>
  <div class="row"><button class="btn" id="rNext"></button><button class="btn ghost" id="rRetry" data-t="retry"></button><button class="btn ghost" id="rMap" data-t="map"></button></div>
  <div class="row" id="saveRow" style="margin-top:6px"><input id="nick" maxlength="12"><button class="btn alt" id="save" style="font-size:15px;padding:9px 14px" data-t="save"></button></div>
  <div class="row"><button class="btn alt" id="share" style="font-size:15px;padding:9px 14px" data-t="share"></button><a class="btn ghost" href="https://www.instagram.com/mimo.mimosa.morticia/" target="_blank" rel="noopener" data-t="follow"></a></div>
</div>

<!-- RANKING -->
<div id="rank" class="screen">
  <h2 data-t="rank"></h2>
  <p class="small" data-t="rankInfo"></p>
  <div id="board"><ol id="top"></ol></div>
  <button class="btn" id="rankBack" data-t="back"></button>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
// =================== TEXT ===================
const DISTRICTS={
 pt:[["Praia do Pôr do Sol","Calçadão, palmeiras e os primeiros bulldogs de plantão."],["Centro Neon","Noite, letreiros piscando e trânsito pesado."],["Porto das Palmeiras","Dia de sol, caminhões no porto e muitos petiscos."],["Docas da Tempestade","Chuva forte, pista escura e polícia por todo lado."],["Vice Heights","A cobertura do Chefe Bulldog. A fuga final!"]],
 en:[["Sunset Beach","Boardwalk, palm trees and the first bulldogs on patrol."],["Neon Downtown","Night, flashing signs and heavy traffic."],["Palm Harbor","Sunny day, harbor trucks and lots of treats."],["Storm Docks","Heavy rain, dark road and cops everywhere."],["Vice Heights","The Bulldog Chief's penthouse. The final getaway!"]]};
const MNAMES={
 pt:["Corrida do Petisco","Patrulha Bulldog","Entrega Noturna","Fuga do Pet Shop","Rota do Atum","Sirene Ligada","Sem Freio","Missão Sardinha","Último Retorno","CHEFE BULLDOG"],
 en:["Treat Run","Bulldog Patrol","Night Delivery","Pet Shop Escape","Tuna Route","Sirens On","No Brakes","Operation Sardine","Last Exit","BULLDOG CHIEF"]};
const T={
 pt:{presents:"@MIMO.MIMOSA.MORTICIA APRESENTA",tag:"50 MISSÕES · NINGUÉM FICA PARA TRÁS",play:"JOGAR ▶",rank:"🏆 RANKING",start:"ACELERAR ▶",map:"MAPA",resume:"CONTINUAR",retry:"REPETIR",back:"VOLTAR",next:"PRÓXIMA ▶",save:"SALVAR NO RANKING",share:"COMPARTILHAR",follow:"Siga os gatos 🐾",
  rule:"Os três são uma equipe só: se um cair, gaste uma vida ❤️ para levantar. A missão só termina com os três de pé!",
  fan:"Jogo de fã, sem vínculo com nenhum estúdio de games",
  keys:"Teclado: ← → dirige · 1 Soneca · 2 Rugido · 3 Lanchão · R ressuscitar · P pausa. No celular: arraste para dirigir e toque nos gatos.",
  roles:{mimo:["MIMO","O cansado 😴","Dirige o carro. A energia acaba: pegue café ☕. SONECA deixa o tempo lento."],mimosa:["MIMOSA","A brava 😾","RUGIDO espanta carros e derruba os bulldogs (e o chefe!)."],morticia:["MORTÍCIA","A comilona 😋","Precisa comer 🐟. Barriga cheia libera o LANCHÃO: ímã + pontos x2."]},
  ab:{mimo:"SONECA",mimosa:"RUGIDO",morticia:"LANCHÃO"},
  win:"MISSÃO CUMPRIDA!",fail:"PEGOS!",failAll:"Os três caíram! Tente de novo.",
  brief:(m)=>`<b>Distância:</b> ${m.km} km · <b>Meta de petiscos:</b> ${m.goal} 🐟<br>⭐ Terminar com os três · ⭐ Pegar a meta de petiscos · ⭐ Ninguém desmaiar${m.boss?`<br><br>🐶 <b>CHEFE BULLDOG!</b> Use o RUGIDO da Mimosa (ou a erva-de-gato 🌿) quando o caminhão chegar perto. ${m.bossHp} acertos para vencer.`:""}`,
  info:(r)=>`🐟 ${r.treats}/${r.goal} · 🚓 ${r.cops} · ❤️ ${r.lives}${r.newLife?" (+1 vida de bônus!)":""}`,
  lives:"Vidas",down:"DESMAIOU",tapRev:"toque: -1 ❤️",noLives:"Sem vidas! Pegue uma 🐾 dourada.",revived:"de pé de novo!",behind:"NINGUÉM FICA PARA TRÁS! Levante o gato para cruzar a chegada.",
  fx:{nap:"SONECA!",roar:"RUGIDO!",snack:"LANCHÃO!",coffee:"CAFÉ!",paw:"+1 VIDA!",nip:"ERVA-DE-GATO!",hit:"AI!",hungry:"FOME!",sleepy:"Zzz...",boss:"CHEFE BULLDOG!",bossHit:"BOOM!",finish:"CHEGADA!"},
  rankInfo:"Soma dos melhores pontos de todas as missões.",saved:"Salvo no ranking! 🏆",offline:"Ranking online indisponível agora — seu progresso fica salvo neste aparelho.",copied:"Link copiado!",nick:"Seu nome",
  shareTxt:(s,l)=>`Cheguei na missão ${l} do VICE PAWS com ${s} pontos 🐾🌴 Mimo, Mimosa e Mortícia contra os bulldogs! Duvido você chegar mais longe:`,
  locked:"Termine a missão anterior para liberar."},
 en:{presents:"@MIMO.MIMOSA.MORTICIA PRESENTS",tag:"50 MISSIONS · NO CAT LEFT BEHIND",play:"PLAY ▶",rank:"🏆 RANKING",start:"FLOOR IT ▶",map:"MAP",resume:"CONTINUE",retry:"RETRY",back:"BACK",next:"NEXT ▶",save:"SAVE TO RANKING",share:"SHARE",follow:"Follow the cats 🐾",
  rule:"The three are one team: if one goes down, spend a life ❤️ to get them up. A mission only ends with all three standing!",
  fan:"Fan game, not affiliated with any game studio",
  keys:"Keyboard: ← → steer · 1 Nap · 2 Roar · 3 Feast · R revive · P pause. On phones: drag to steer and tap the cats.",
  roles:{mimo:["MIMO","The tired one 😴","Drives the car. Energy runs out: grab coffee ☕. NAP slows time down."],mimosa:["MIMOSA","The fierce one 😾","ROAR blasts cars away and knocks out bulldogs (and the boss!)."],morticia:["MORTICIA","The hungry one 😋","Must eat 🐟. A full belly unlocks FEAST: magnet + x2 points."]},
  ab:{mimo:"NAP",mimosa:"ROAR",morticia:"FEAST"},
  win:"MISSION COMPLETE!",fail:"BUSTED!",failAll:"All three went down! Try again.",
  brief:(m)=>`<b>Distance:</b> ${m.km} km · <b>Treat goal:</b> ${m.goal} 🐟<br>⭐ Finish with all three · ⭐ Reach the treat goal · ⭐ Nobody faints${m.boss?`<br><br>🐶 <b>BULLDOG CHIEF!</b> Use Mimosa's ROAR (or catnip 🌿) when the truck gets close. ${m.bossHp} hits to win.`:""}`,
  info:(r)=>`🐟 ${r.treats}/${r.goal} · 🚓 ${r.cops} · ❤️ ${r.lives}${r.newLife?" (+1 bonus life!)":""}`,
  lives:"Lives",down:"FAINTED",tapRev:"tap: -1 ❤️",noLives:"No lives! Grab a golden 🐾.",revived:"back on their paws!",behind:"NO CAT LEFT BEHIND! Revive them to cross the finish.",
  fx:{nap:"NAP!",roar:"ROAR!",snack:"FEAST!",coffee:"COFFEE!",paw:"+1 LIFE!",nip:"CATNIP!",hit:"OUCH!",hungry:"HUNGRY!",sleepy:"Zzz...",boss:"BULLDOG CHIEF!",bossHit:"BOOM!",finish:"FINISH!"},
  rankInfo:"Sum of your best scores across all missions.",saved:"Saved to ranking! 🏆",offline:"Online ranking unavailable right now — your progress is saved on this device.",copied:"Link copied!",nick:"Your name",
  shareTxt:(s,l)=>`I reached mission ${l} in VICE PAWS with ${s} points 🐾🌴 Mimo, Mimosa and Morticia vs the bulldog cops! Bet you can't go further:`,
  locked:"Finish the previous mission to unlock."}
};
let L=(()=>{try{return localStorage.getItem('vp_lang')||((navigator.language||'pt').startsWith('pt')?'pt':'en')}catch(e){return 'pt'}})();
const t=()=>T[L];

// =================== SAVE ===================
const SKEY='vp_save_v2';
let S=(()=>{try{return JSON.parse(localStorage.getItem(SKEY))||null}catch(e){return null}})()||{unlocked:1,stars:{},best:{},lives:3};
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}}
const totalStars=()=>Object.values(S.stars).reduce((a,b)=>a+b,0);
const totalScore=()=>Object.values(S.best).reduce((a,b)=>a+b,0);

// =================== ASSETS ===================
const TEAM=['mimo','mimosa','morticia'];
const IMG={};TEAM.forEach(n=>{const i=new Image();i.src=`/img/${n}.jpg`;IMG[n]=i});

// =================== UI ===================
function applyLang(){
  document.documentElement.lang=L==='pt'?'pt-BR':'en';
  document.querySelectorAll('[data-t]').forEach(e=>{const v=t()[e.dataset.t];if(typeof v==='string')e.textContent=v});
  $('nick').placeholder=t().nick;$('lang').textContent=L==='pt'?'EN':'PT';
  $('team').innerHTML=TEAM.map(n=>{const r=t().roles[n];return `<div class="tc"><img src="/img/${n}.jpg" alt="${r[0]}"><b>${r[0]}</b><i>${r[1]}</i>${r[2]}</div>`}).join('');
  if($('map').classList.contains('on'))buildMap(curDist);
}
$('lang').onclick=()=>{L=L==='pt'?'en':'pt';try{localStorage.setItem('vp_lang',L)}catch(e){};applyLang()};
const SCREENS=['menu','map','brief','pause','result','rank'];
function show(id){SCREENS.forEach(s=>$(s).classList.toggle('on',s===id));$('topBtns').style.display=id?'none':'flex';$('lang').style.display=(id==='menu'||id==='map')?'block':'none'}
function toast(m,ms=2300){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(e._h);e._h=setTimeout(()=>e.style.display='none',ms)}

let curDist=0;
function buildMap(d){
  curDist=d;const D=DISTRICTS[L];
  $('tabs').innerHTML=D.map((x,i)=>`<button class="btn ghost${i===d?' on':''}" data-d="${i}">${i+1}. ${x[0]}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>buildMap(+b.dataset.d));
  $('distName').textContent=D[d][0];$('distDesc').textContent=D[d][1];
  $('totStars').textContent=`⭐ ${totalStars()}/150`;$('livesTxt').textContent=`❤️ ${S.lives}`;
  let h='';for(let i=1;i<=10;i++){const n=d*10+i,st=S.stars[n]||0,lock=n>S.unlocked;
    h+=`<button class="lv${i===10?' boss':''}${lock?' lock':''}${n===S.unlocked?' next':''}" data-n="${n}">${i===10?'🐶':n}<small>${lock?'🔒':'★'.repeat(st)+'☆'.repeat(3-st)}</small></button>`}
  $('grid').innerHTML=h;
  $('grid').querySelectorAll('.lv').forEach(b=>b.onclick=()=>{const n=+b.dataset.n;if(n>S.unlocked){toast(t().locked);return}openBrief(n)});
}
$('go').onclick=()=>{ac();buildMap(Math.min(4,Math.floor((S.unlocked-1)/10)));show('map')};
$('mapBack').onclick=()=>show('menu');
$('toRank').onclick=()=>{show('rank');loadBoard()};$('rankBack').onclick=()=>show('menu');

let curLevel=1;
function mission(n){
  const d=Math.floor((n-1)/10),i=(n-1)%10,boss=i===9;
  return{n,d,boss,name:MNAMES[L][i],len:5200+n*230,v0:Math.min(520,230+n*4.6),goal:18+Math.round(n*1.6),
    trafficInt:Math.max(.36,1.22-n*.016),copInt:n<2?99:Math.max(1.15,7.2-n*.12),copSpd:70+n*2.2,
    foodDrain:1.1+n*.025,energyDrain:1.8+n*.035,bossHp:boss?3+d:0,km:((5200+n*230)/1000).toFixed(1),wanted:Math.min(5,1+d)};
}
function openBrief(n){curLevel=n;const m=mission(n);
  $('bDist').textContent=`${DISTRICTS[L][m.d][0].toUpperCase()} · ${'★'.repeat(m.wanted)}`;
  $('bTitle').textContent=`${n}. ${m.name}`;$('bText').innerHTML=t().brief(m);show('brief')}
$('bGo').onclick=()=>startLevel(curLevel);$('bBack').onclick=()=>{buildMap(Math.floor((curLevel-1)/10));show('map')};

// =================== CANVAS ===================
const W=420,H=760,PANEL=H-118,cv=$('c'),cx=cv.getContext('2d');
function fit(){const s=Math.min(innerWidth/W,innerHeight/H);const dpr=Math.min(devicePixelRatio||1,2);
  cv.style.width=W*s+'px';cv.style.height=H*s+'px';cv.width=W*dpr;cv.height=H*dpr;cx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',fit);fit();

// =================== AUDIO ===================
let AC=null,muted=(()=>{try{return localStorage.getItem('vp_mute')==='1'}catch(e){return false}})();
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function blip(f,d=.08,type='square',v=.05,slide=0){if(muted)return;const a=ac();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),a.currentTime+d);g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,a.currentTime+d);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
$('bMute').onclick=()=>{muted=!muted;try{localStorage.setItem('vp_mute',muted?'1':'0')}catch(e){};$('bMute').textContent=muted?'🔇':'🔊'};$('bMute').textContent=muted?'🔇':'🔊';

// =================== GAME ===================
const ROAD_L=58,ROAD_R=362,LANES=4,LW=(ROAD_R-ROAD_L)/LANES;
const rnd=(a,b)=>a+Math.random()*(b-a),lane=i=>ROAD_L+LW*i+LW/2,clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const CAR_COLORS=['#2de2e6','#ffb347','#9b5de5','#00f5a0','#f15bb5','#fee440','#ff6b6b','#4cc9f0'];
let G=null,state='menu',last=0,keys={},touchX=null;

function startLevel(n){
  ac();const m=mission(n);
  G={m,t:0,dist:0,scroll:0,speed:m.v0,score:0,treats:0,copsDown:0,fainted:false,
    cats:{mimo:{hp:3,down:false,cd:0},mimosa:{hp:3,down:false,cd:0},morticia:{hp:3,down:false,cd:0}},
    energy:100,food:60,hungryT:0,nap:0,feast:0,nip:0,inv:0,shake:0,roarFx:0,
    p:{x:W/2,y:PANEL-110,w:54,h:88},ents:[],fx:[],rain:[],
    trafT:1,treatT:.3,copT:m.copInt*.6,coffeeT:7,nipT:rnd(14,22),pawT:rnd(25,40),
    boss:null,bossSpawned:false,finished:false,behindT:0,over:false};

function update(rdt){

  const cm=G.cats;

  G.nipT-=dt;if(G.nipT<=0){spawnItem('nip');G.nipT=rnd(18,28)}
  G.pawT-=dt;if(G.pawT<=0){spawnItem('paw');G.pawT=aliveCats().length<3?rnd(5,8):rnd(35,55)}
  // boss
  if(m.boss&&!G.bossSpawned&&G.dist>m.len*.55){G.bossSpawned=true;G.boss={x:W/2,y:H+140,w:84,h:150,hp:m.bossHp,max:m.bossHp,cool:0,charge:0};addFx(W/2,H/2,t().fx.boss,'#ff4fb8');for(let i=0;i<3;i++)setTimeout(()=>blip(700,.25,'sawtooth',.06,-300),i*300)}
  if(G.boss&&G.boss.hp>0){const b=G.boss;b.cool-=dt;b.charge+=dt;
    const ty=b.charge%5<3.6?p.y+190:p.y+20;b.y+=(ty-b.y)*1.4*dt;b.x+=clamp(p.x-b.x,-90*dt,90*dt);
    if(hit({x:p.x,y:p.y,w:p.w,h:p.h},b,.7)){if(G.nip>0)bossHit();else{damage();b.y+=60}}}

    else if(e.k==='cop'){e.y+=e.vy*dt;e.x+=clamp(p.x-e.x,-75*dt,75*dt)}
    else e.y+=v*dt;
    const mag=(G.feast>0&&(e.k==='treat'||e.k==='bag'))?190:0;
    if(mag){const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy);if(d<mag&&d>1){e.x+=dx/d*340*dt;e.y+=dy/d*340*dt}}
  }

    else if(hit(pb,e,e.k==='cop'?.72:.78)){
      if(G.nip>0){e.dead=true;G.score+=30;if(e.k==='cop')G.copsDown++;addFx(e.x,e.y,'+30','#7CFF6B');G.shake=.15;blip(160,.15,'sawtooth',.08,-80)}

function bulldog(fx,fy,r,hat=true){cx.fillStyle='#c98b4f';cx.beginPath();cx.arc(fx,fy,r,0,7);cx.fill();cx.strokeStyle='#000';cx.lineWidth=2;cx.stroke();
  cx.fillStyle='#7a4a24';cx.beginPath();cx.ellipse(fx-r*.85,fy-r*.6,r*.42,r*.33,-.6,0,7);cx.ellipse(fx+r*.85,fy-r*.6,r*.42,r*.33,.6,0,7);cx.fill();
  cx.fillStyle='#f3d9b8';cx.beginPath();cx.ellipse(fx,fy+r*.33,r*.66,r*.5,0,0,7);cx.fill();
  cx.fillStyle='#000';cx.fillRect(fx-r*.42,fy-r*.25,r*.25,r*.25);cx.fillRect(fx+r*.17,fy-r*.25,r*.25,r*.25);cx.beginPath();cx.arc(fx,fy+r*.17,r*.2,0,7);cx.fill();
  if(hat){cx.fillStyle='#1d2a5a';cx.fillRect(fx-r*.85,fy-r*1.25,r*1.7,r*.5);cx.fillStyle='#ffd23f';cx.fillRect(fx-r*.17,fy-r*1.17,r*.34,r*.34)}}
function drawCop(e){drawCar(e,'#f4f4f8','#111');const x=e.x-e.w/2,y=e.y-e.h/2;cx.fillStyle='#111';cx.fillRect(x,y+e.h*.72,e.w,8);
  const b=Math.floor(G.t*8)%2;cx.fillStyle=b?'#ff2040':'#2060ff';cx.fillRect(x+6,y+e.h*.45,e.w/2-6,7);cx.fillStyle=b?'#2060ff':'#ff2040';cx.fillRect(x+e.w/2,y+e.h*.45,e.w/2-6,7);bulldog(e.x,y+e.h*.33,12)}
function drawBoss(b){const e={x:b.x,y:b.y,w:b.w,h:b.h};drawCar(e,'#1d2a5a','#0b1030');const x=b.x-b.w/2,y=b.y-b.h/2;
  const bl=Math.floor(G.t*10)%2;cx.fillStyle=bl?'#ff2040':'#2060ff';cx.fillRect(x+6,y+b.h*.5,b.w-12,9);bulldog(b.x,y+b.h*.3,24);
  cx.fillStyle='#000a';rr(x-6,y-18,b.w+12,10,5);cx.fill();cx.fillStyle='#ff4040';rr(x-6,y-18,(b.w+12)*b.hp/b.max,10,5);cx.fill()}
function drawItem(e){const s=1+Math.sin(G.t*6+e.ph)*.08;cx.save();cx.translate(e.x,e.y);cx.scale(s,s);cx.textAlign='center';cx.textBaseline='middle';
  if(e.k==='treat'){cx.fillStyle='#ffb347';cx.beginPath();cx.ellipse(-2,0,11,7,0,0,7);cx.fill();cx.beginPath();cx.moveTo(8,0);cx.lineTo(15,-7);cx.lineTo(15,7);cx.closePath();cx.fill();cx.strokeStyle='#000';cx.lineWidth=2;cx.beginPath();cx.ellipse(-2,0,11,7,0,0,7);cx.stroke();cx.fillStyle='#000';cx.fillRect(-8,-2,2.5,2.5)}
  else if(e.k==='bag'){cx.fillStyle='#c9964f';rr(-16,-14,32,30,8);cx.fill();cx.strokeStyle='#000';cx.lineWidth=2.5;cx.stroke();cx.font='15px serif';cx.fillText('🐟',0,2)}
  else{cx.shadowColor=e.k==='paw'?'#ffd23f':e.k==='nip'?'#7CFF6B':'#fff';cx.shadowBlur=16;cx.font='26px serif';cx.fillText(e.k==='coffee'?'☕':e.k==='nip'?'🌿':'🐾',0,0);
    if(e.k==='paw'){cx.globalCompositeOperation='source-atop';cx.fillStyle='#ffd23faa';cx.fillRect(-16,-16,32,32);cx.globalCompositeOperation='source-over'}}
  cx.restore()}
function face(n,x,y,r,down){cx.save();cx.beginPath();cx.arc(x,y,r,0,7);cx.clip();if(IMG[n].complete)cx.drawImage(IMG[n],x-r,y-r,r*2,r*2);if(down){cx.fillStyle='#000a';cx.fillRect(x-r,y-r,r*2,r*2)}cx.restore();
  cx.beginPath();cx.arc(x,y,r,0,7);cx.lineWidth=2;cx.strokeStyle='#000';cx.stroke();if(down){cx.font=`${r}px serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('💫',x,y)}}
function drawPlayer(){const p=G.p,x=p.x-p.w/2,y=p.y-p.h/2;
  if(G.inv>0&&Math.floor(G.t*14)%2===0&&G.nip<=0)return;
  cx.save();if(G.nip>0){cx.shadowColor='#7CFF6B';cx.shadowBlur=26}
  cx.fillStyle='#0007';rr(x+4,y+8,p.w,p.h,12);cx.fill();
  const g=cx.createLinearGradient(x,0,x+p.w,0);g.addColorStop(0,'#ff2fa8');g.addColorStop(.5,'#ff8ad6');g.addColorStop(1,'#ff2fa8');cx.fillStyle=g;rr(x,y,p.w,p.h,12);cx.fill();cx.strokeStyle='#000';cx.lineWidth=3;cx.stroke();cx.restore();
  cx.fillStyle='#bff4ff';rr(x+6,y+9,p.w-12,8,4);cx.fill();cx.fillStyle='#3a0f2e';rr(x+5,y+20,p.w-10,p.h*.62,8);cx.fill();
  face('mimo',p.x,y+34,11,G.cats.mimo.down);face('mimosa',x+15,y+60,10,G.cats.mimosa.down);face('morticia',x+p.w-15,y+60,10,G.cats.morticia.down);
  cx.fillStyle='#fff6b0';cx.fillRect(x+5,y+2,9,4);cx.fillRect(x+p.w-14,y+2,9,4);
  if(G.roarFx>0){cx.strokeStyle=`rgba(255,79,184,${G.roarFx*2})`;cx.lineWidth=6;cx.beginPath();cx.arc(p.x,p.y,190*(1-G.roarFx/.45)+30,0,7);cx.stroke()}
  if(G.feast>0){cx.strokeStyle='#ffb34766';cx.setLineDash([6,6]);cx.lineWidth=2;cx.beginPath();cx.arc(p.x,p.y,190,0,7);cx.stroke();cx.setLineDash([])}}
function bar(x,y,w,h,v,col){cx.fillStyle='#0009';rr(x,y,w,h,h/2);cx.fill();cx.fillStyle=col;rr(x,y,Math.max(h,w*v),h,h/2);cx.fill()}
function drawPanel(){
  const y0=PANEL;cx.fillStyle='#120420ee';cx.fillRect(0,y0,W,H-y0);cx.fillStyle='#ff4fb8';cx.fillRect(0,y0,W,3);
  TEAM.forEach((n,i)=>{const c=G.cats[n],x=i*W/3+W/6,y=y0+38,r=26;
    face(n,x,y,r,c.down);
    // cooldown / ready ring
    let ready=!c.down&&c.cd<=0,frac=c.down?0:(n==='morticia'?G.food/100:(c.cd>0?1-c.cd/(n==='mimo'?14:8):1));
    if(n==='morticia')ready=!c.down&&G.food>=100;
    cx.lineWidth=5;cx.strokeStyle='#ffffff25';cx.beginPath();cx.arc(x,y,r+5,0,7);cx.stroke();
    cx.strokeStyle=ready?(Math.floor(G.t*4)%2?'#7CFF6B':'#fff'):'#ff4fb8';cx.beginPath();cx.arc(x,y,r+5,-Math.PI/2,-Math.PI/2+Math.PI*2*clamp(frac,0,1));cx.stroke();
    cx.font='14px serif';cx.textAlign='center';cx.textBaseline='middle';
    for(let h=0;h<3;h++)cx.fillText(h<c.hp?'❤️':'🖤',x-18+h*18,y+r+16);
    cx.font='900 12px system-ui';cx.fillStyle=c.down?'#ff6b6b':ready?'#7CFF6B':'#fff';
    cx.fillText(c.down?(S.lives>0?t().tapRev:t().down):t().ab[n],x,y+r+34);
  });
  // meters
  bar(10,y0+8,70,7,G.energy/100,G.energy<22?'#ff6b6b':'#9bd1ff');cx.font='11px serif';cx.textAlign='left';cx.fillText('☕',84,y0+12);
  bar(W-80,y0+8,70,7,G.food/100,G.food<20?'#ff6b6b':'#ffb347');cx.textAlign='right';cx.fillText('🐟',W-84,y0+12);
}
function drawHUD(){const m=G.m;cx.save();cx.textBaseline='top';cx.lineWidth=5;cx.strokeStyle='#000';
  cx.font='900 italic 28px system-ui';cx.fillStyle='#fff';const s=Math.floor(G.score).toLocaleString();cx.strokeText(s,12,10);cx.fillText(s,12,10);
  cx.font='800 13px system-ui';const lbl=`M${m.n} · 🐟 ${G.treats}/${m.goal}`;cx.strokeText(lbl,13,42);cx.fillStyle='#ffb347';cx.fillText(lbl,13,42);
  cx.textAlign='right';const lv=`❤️ ${S.lives}`;cx.strokeText(lv,W-56,14);cx.fillStyle='#fff';cx.fillText(lv,W-56,14);
  // progress bar
  const pr=clamp(G.dist/m.len,0,1);bar(12,64,W-24,8,pr,'#2de2e6');cx.font='16px serif';cx.textAlign='center';cx.fillText('🏁',W-14,58);cx.fillText('🚗',12+(W-24)*pr,56);
  if(G.nap>0){cx.fillStyle='#9bd1ff22';cx.fillRect(0,0,W,PANEL)}
  if(G.nip>0){cx.font='900 15px system-ui';cx.fillStyle='#7CFF6B';cx.fillText('🌿 '+G.nip.toFixed(1)+'s',W/2,84)}
  cx.restore()}
function render(){
  cx.save();if(G.shake>0)cx.translate(rnd(-5,5),rnd(-5,5));
  drawWorld(G.m.d,G.scroll,G.t);
  const m=G.m,fy=G.p.y-(m.len-G.dist);if(fy>-40&&fy<PANEL){for(let i=0;i<12;i++){cx.fillStyle=i%2?'#000':'#fff';cx.fillRect(ROAD_L+i*(ROAD_R-ROAD_L)/12,fy,(ROAD_R-ROAD_L)/12,14)}}
  for(const e of G.ents){if(e.k==='car')drawCar(e,e.c);else if(e.k!=='cop')drawItem(e)}
  drawPlayer();for(const e of G.ents)if(e.k==='cop')drawCop(e);if(G.boss&&G.boss.hp>0)drawBoss(G.boss);
  if(m.d===3){cx.strokeStyle='#9fc4ff66';cx.lineWidth=1.5;cx.beginPath();for(const r of G.rain){cx.moveTo(r.x,r.y);cx.lineTo(r.x-6,r.y+16)}cx.stroke()}
  cx.textAlign='center';cx.textBaseline='middle';for(const f of G.fx){cx.globalAlpha=clamp(1.2-f.t,0,1);cx.font='900 italic 21px system-ui';cx.lineWidth=4;cx.strokeStyle='#000';cx.strokeText(f.txt,f.x,f.y);cx.fillStyle=f.col;cx.fillText(f.txt,f.x,f.y)}cx.globalAlpha=1;
  if(G.boss&&G.boss.hp>0||G.ents.some(e=>e.k==='cop'&&e.y<PANEL)){cx.fillStyle=`rgba(${Math.floor(G.t*4)%2?'255,0,60':'30,80,255'},0.06)`;cx.fillRect(0,0,W,PANEL)}
  drawHUD();cx.restore();drawPanel();
}
let demoT=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000||0);last=now;
  if(state==='play'&&G){update(dt);if(state==='play')render();else render()}
  else if(!G){demoT+=dt;drawWorld(Math.floor(demoT/6)%5,demoT*200,demoT)}
  requestAnimationFrame(loop)}
applyLang();requestAnimationFrame(loop);
window.__vp={get state(){return state},get G(){return G},get S(){return S},startLevel,ability,revive,win:()=>win()};
})();
</script>
